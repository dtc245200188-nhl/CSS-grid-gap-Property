<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Gap</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>CSS | grid-gap Property</h1>

    <!-- Ví dụ 1: khoảng cách hàng và cột bằng nhau -->
    <div class="example" id="example1">
        <h2>Ví dụ 1: <code>grid-gap: 20px;</code></h2>
        <div class="grid-container grid-container-1">
            <div>Ô 1</div>
            <div>Ô 2</div>
            <div>Ô 3</div>
            <div>Ô 4</div>
        </div>
    </div>

    <!-- Ví dụ 2: khoảng cách hàng và cột khác nhau -->
    <div class="example" id="example2">
        <h2>Ví dụ 2: <code>grid-gap: 30px 10px;</code></h2>
        <div class="grid-container grid-container-2">
            <div>Ô 1</div>
            <div>Ô 2</div>
            <div>Ô 3</div>
            <div>Ô 4</div>
            <div>Ô 5</div>
            <div>Ô 6</div>
        </div>
    </div>
</body>
</html>
